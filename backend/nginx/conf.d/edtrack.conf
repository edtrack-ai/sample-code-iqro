# Unified Domain: edtrack.org
# Frontend: edtrack.org
# Static Frontend (Empty for now)
server {
    listen 80;
    server_name iqro.online www.iqro.online edtrack.org www.edtrack.org;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend HTTPS
server {
    listen 443 ssl;
    server_name iqro.online www.iqro.online edtrack.org www.edtrack.org;

    ssl_certificate /etc/letsencrypt/live/api.iqro.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iqro.online/privkey.pem;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# Backend API & IP Access
server {
    listen 80 default_server;
    listen 443 ssl;
    server_name api.iqro.online api.edtrack.org 95.111.239.53;

    ssl_certificate /etc/letsencrypt/live/api.edtrack.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.edtrack.org/privkey.pem;

    # Set Max Upload Size
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/)?ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
