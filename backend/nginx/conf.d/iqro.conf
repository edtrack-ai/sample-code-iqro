# Iqro AI — Production Nginx Configuration (iqro.online & api.iqro.online)

# -------------------------------------------------------------
# 1. FRONTEND: iqro.online & www.iqro.online (Static Build Files)
# -------------------------------------------------------------
server {
    listen 80;
    server_name iqro.online www.iqro.online 169.58.91.148;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/iqro/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/iqro/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# -------------------------------------------------------------
# 2. BACKEND API: api.iqro.online (Proxy to Django 8000 Port)
# -------------------------------------------------------------
server {
    listen 80;
    server_name api.iqro.online;

    client_max_body_size 50M;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Handle Preflight OPTIONS requests directly in Nginx
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-CSRFToken, Cache-Control, Pragma' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE / WebSocket streaming for AI roadmap & lesson generation
    location ~ ^/(api/)?ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /static/ {
        alias /var/www/iqro/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /var/www/iqro/backend/media/;
        expires 30d;
    }
}
