name: Iqro AI Backend Continuous Deployment (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend to VPS Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH & Deploy to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_BACKEND: ${{ secrets.ENV_BACKEND }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: ENV_BACKEND,GH_TOKEN
          script: |
            mkdir -p /var/www/iqro/backend
            mkdir -p /var/www/certbot
            cd /var/www/iqro/backend
            
            # Force reset local git changes to ensure git pull never fails
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            # Safely write multiline .env file from ENV_BACKEND if set
            if [ -n "$ENV_BACKEND" ]; then
              printf '%s\n' "$ENV_BACKEND" > /var/www/iqro/backend/.env
            fi

            # Clean up potentially stale bytecode or cache files
            find . -name "*.pyc" -delete || true
            find . -type d -name "__pycache__" -exec rm -r {} + || true

            # Rebuild images normally (Docker will use cached pip install if requirements haven't changed, but will copy new code)
            docker-compose -f docker-compose.prod.yml build
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            
            # Update Nginx base config
            sudo cp nginx/conf.d/iqro.conf /etc/nginx/sites-available/iqro.conf
            sudo ln -sf /etc/nginx/sites-available/iqro.conf /etc/nginx/sites-enabled/iqro.conf
            sudo rm -f /etc/nginx/sites-enabled/default
            
            # Dynamically inject SSL directives if certificates exist, to prevent chicken-and-egg problems
            if sudo test -f /etc/letsencrypt/live/iqro.online/fullchain.pem; then
              sudo sed -i 's/listen 80;/listen 80;\n    listen 443 ssl;\n    ssl_certificate \/etc\/letsencrypt\/live\/iqro.online\/fullchain.pem;\n    ssl_certificate_key \/etc\/letsencrypt\/live\/iqro.online\/privkey.pem;/g' /etc/nginx/sites-available/iqro.conf
            fi
            
            # Request/renew certificates if they don't exist yet (for new server setups)
            sudo certbot --nginx --non-interactive --agree-tos -m edtrack.org@gmail.com -d iqro.online -d www.iqro.online -d api.iqro.online --keep-until-expiring || true
            
            sudo systemctl reload nginx
            
            echo "✅ Backend and SSL deployed successfully to https://api.iqro.online!"
