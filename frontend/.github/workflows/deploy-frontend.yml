name: Deploy Frontend to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.edtrack.org
          VITE_GOOGLE_CLIENT_ID: 103618139136-fehdfpa9qn345btog77p5b3qm0sfr1j2.apps.googleusercontent.com

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via Rsync
        run: |
          # The --delete flag ensures stale files are removed
          # We use -e to specify the ssh command with the identity file
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./dist/ \
            root@${{ secrets.SERVER_IP }}:/var/www/frontend/
