name: Iqro AI Frontend Continuous Deployment (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Frontend to VPS Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH & Deploy Frontend to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FRONTEND: ${{ secrets.ENV_FRONTEND }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          envs: ENV_FRONTEND,GH_TOKEN
          script: |
            mkdir -p /var/www/iqro/frontend
            cd /var/www/iqro/frontend
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            # Safely write multiline .env file from ENV_FRONTEND if set
            if [ -n "$ENV_FRONTEND" ]; then
              printf '%s\n' "$ENV_FRONTEND" > /var/www/iqro/frontend/.env
            fi

            # Clear dist and vite cache to ensure fresh code build without delaying npm install
            rm -rf node_modules/.vite
            rm -rf dist
            npm install
            npm run build
            sudo systemctl reload nginx
            echo "✅ Frontend deployed successfully (FAST CLEAN BUILD) to https://iqro.online!"
